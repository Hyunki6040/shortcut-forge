[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shortcut-forge"
version = "0.2.1"
description = "Apple Shortcuts MCP server: let Claude, Codex or any LLM build, lint and sign real iOS Shortcuts (.shortcut) that run on iPhone. iOS 27 aware."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Robert Kim (김현기)" }]
keywords = ["apple shortcuts mcp", "shortcuts mcp", "mcp", "mcp-server", "claude", "codex", "chatgpt", "apple-shortcuts", "ios-shortcuts", "siri-shortcuts", "shortcut file", "ios", "ios27", "apple-health", "automation", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Code Generators",
  "Intended Audience :: Developers",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shortcut-forge = "shortcut_forge.cli:main"
shortcut-forge-mcp = "shortcut_forge.server:main"

[project.urls]
Homepage = "https://github.com/Hyunki6040/shortcut-forge"
Issues = "https://github.com/Hyunki6040/shortcut-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shortcut_forge"]

[tool.hatch.build.targets.wheel.force-include]
"library" = "shortcut_forge/library"

[tool.hatch.build.targets.sdist]
include = ["src", "library", "tests", "README*.md", "LICENSE", "docs", "skills", "commands", ".claude-plugin", ".mcp.json", "manifest.json", "server.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
