<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="sc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <text x="60" y="78" font-size="44" font-weight="700" fill="#f8fafc">shortcut-forge</text>
  <text x="60" y="116" font-size="22" fill="#cbd5e1">Say it. Claude builds it. Your iPhone runs it.</text>

  <!-- prompt bubble -->
  <rect x="60" y="170" width="330" height="150" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="84" y="204" font-size="15" fill="#94a3b8">You</text>
  <text x="84" y="236" font-size="18" fill="#e2e8f0">"Log my vitamins to Health</text>
  <text x="84" y="262" font-size="18" fill="#e2e8f0">and remind me tomorrow,</text>
  <text x="84" y="288" font-size="18" fill="#e2e8f0">but never twice."</text>

  <line x1="400" y1="245" x2="470" y2="245" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- forge box -->
  <rect x="480" y="170" width="300" height="150" rx="18" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <text x="504" y="204" font-size="15" fill="#c4b5fd">MCP · build → lint → sign</text>
  <text x="504" y="238" font-size="16" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace">✓ 14 on-device rules</text>
  <text x="504" y="264" font-size="16" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace">✓ mcg → mg for Health</text>
  <text x="504" y="290" font-size="16" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace">✓ shortcuts sign (AEA1)</text>

  <line x1="790" y1="245" x2="860" y2="245" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- phone -->
  <rect x="880" y="140" width="130" height="230" rx="26" fill="#020617" stroke="#475569" stroke-width="3"/>
  <rect x="900" y="175" width="90" height="90" rx="22" fill="url(#sc)"/>
  <path d="M928 220 l14 -22 l14 22 l-14 22 z" fill="#ffffff" opacity="0.92"/>
  <text x="945" y="292" font-size="13" fill="#e2e8f0" text-anchor="middle">Supplement</text>
  <text x="945" y="310" font-size="13" fill="#e2e8f0" text-anchor="middle">Check</text>
  <text x="1040" y="230" font-size="16" fill="#cbd5e1">AirDrop</text>
  <text x="1040" y="254" font-size="16" fill="#cbd5e1">→ Add</text>
  <text x="1040" y="278" font-size="16" fill="#cbd5e1">→ Run</text>
</svg>
