name: release
# Push a tag like v0.1.0. One-time setup:
#  1. PyPI: add a Trusted Publisher for this repo (workflow: release.yml, environment: pypi).
#  2. Nothing else: the MCP Registry accepts GitHub OIDC for io.github.<owner>/* names.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to the official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/mcpb pack . shortcut-forge.mcpb
      - uses: softprops/action-gh-release@v2
        with:
          files: shortcut-forge.mcpb
